<h2>🎬 Listado de Películas</h2>

<!-- 🔄 Spinner de carga -->
<div *ngIf="isLoading" class="spinner-container">
  <mat-spinner diameter="50"></mat-spinner>
</div>

<!-- 🔍 Filtro -->
<mat-form-field appearance="outline" style="width: 100%; margin-bottom: 1rem;">
  <mat-label>Buscar película</mat-label>
  <input matInput (keyup)="aplicarFiltro($event)" placeholder="Ej. Matrix">
</mat-form-field>

<!-- 📊 Tabla con Angular Material -->
<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

  <!-- Columnas -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
    <td mat-cell *matCellDef="let p">{{ p.id }}</td>
  </ng-container>

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Título</th>
    <td mat-cell *matCellDef="let p">{{ p.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="descripcion">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
    <td mat-cell *matCellDef="let p">{{ p.descripcion }}</td>
  </ng-container>

  <ng-container matColumnDef="duracion">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Duración</th>
    <td mat-cell *matCellDef="let p">{{ p.duracion }} min</td>
  </ng-container>

  <ng-container matColumnDef="clasificacion">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Categoría</th>
    <td mat-cell *matCellDef="let p">{{ p.clasificacion }}</td>
  </ng-container>

  <ng-container matColumnDef="fechaCreacion">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha</th>
    <td mat-cell *matCellDef="let p">{{ p.fechaCreacion | date: 'shortDate' }}</td>
  </ng-container>

  <ng-container matColumnDef="imagen">
    <th mat-header-cell *matHeaderCellDef>Imagen</th>
    <td mat-cell *matCellDef="let p">
      <img [src]="p.rutaImagen" alt="{{ p.nombre }}" width="100">
    </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let p">
      <button mat-icon-button [routerLink]="['/editar', p.id]" matTooltip="Editar película">
        <mat-icon color="primary">edit</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Eliminar película">
        <mat-icon color="warn">delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <!-- Encabezado y filas -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<!-- 📌 Paginador -->
<mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
